service: petronect-behavior-backend
frameworkVersion: "4"

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    DATA_MODE: dynamo
    SUPPLIER_HASH_SALT: ${env:SUPPLIER_HASH_SALT, 'CHANGE-ME-IN-PRODUCTION'}
    USERS_TABLE: ${self:service}-users-${sls:stage}
    SESSIONS_TABLE: ${self:service}-sessions-${sls:stage}
    EVENTS_TABLE: ${self:service}-events-${sls:stage}
    SUPPLIER_PROFILES_TABLE: ${self:service}-supplier-profiles-${sls:stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt UsersTable.Arn
            - !Sub "${UsersTable.Arn}/index/*"
            - !GetAtt SessionsTable.Arn
            - !Sub "${SessionsTable.Arn}/index/*"
            - !GetAtt EventsTable.Arn
            - !Sub "${EventsTable.Arn}/index/*"
            - !GetAtt SupplierProfilesTable.Arn

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node

functions:
  health:
    handler: src/handlers/health.handler
    events:
      - httpApi:
          method: GET
          path: /health

  login:
    handler: src/handlers/auth.login
    events:
      - httpApi:
          method: POST
          path: /auth/login

  sessionStart:
    handler: src/handlers/sessions.start
    events:
      - httpApi:
          method: POST
          path: /session/start

  sessionEnd:
    handler: src/handlers/sessions.end
    events:
      - httpApi:
          method: POST
          path: /session/end

  createEvent:
    handler: src/handlers/events.create
    events:
      - httpApi:
          method: POST
          path: /events

  listEvents:
    handler: src/handlers/events.list
    events:
      - httpApi:
          method: GET
          path: /events

  analyticsDashboard:
    handler: src/handlers/analytics.dashboard
    events:
      - httpApi:
          method: GET
          path: /analytics/dashboard

  analyticsSuppliers:
    handler: src/handlers/analytics.suppliers
    events:
      - httpApi:
          method: GET
          path: /analytics/suppliers

  analyticsSupplier:
    handler: src/handlers/analytics.supplierDetail
    events:
      - httpApi:
          method: GET
          path: /analytics/suppliers/{supplierId}

  recommendation:
    handler: src/handlers/recommendations.getBySupplier
    events:
      - httpApi:
          method: GET
          path: /recommendations/{supplierId}

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-users-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: supplierId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: SupplierIndex
            KeySchema:
              - AttributeName: supplierId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    SessionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-sessions-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: sessionId
            AttributeType: S
          - AttributeName: supplierId
            AttributeType: S
          - AttributeName: startedAt
            AttributeType: S
        KeySchema:
          - AttributeName: sessionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: SupplierStartedAtIndex
            KeySchema:
              - AttributeName: supplierId
                KeyType: HASH
              - AttributeName: startedAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    EventsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-events-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: eventId
            AttributeType: S
          - AttributeName: supplierId
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: eventId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: SupplierTimestampIndex
            KeySchema:
              - AttributeName: supplierId
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    SupplierProfilesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-supplier-profiles-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: supplierId
            AttributeType: S
        KeySchema:
          - AttributeName: supplierId
            KeyType: HASH
